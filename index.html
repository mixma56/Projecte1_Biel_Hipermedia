<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Speedrun Hall of Fame</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       
        ::-webkit-scrollbar {
            display: none;
        }

        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-900 flex items-center justify-center min-h-[100dvh] font-sans text-gray-100">
    <!--h-dvh hace que el contenedor tenga la altura total de la ventana del navegador y se adapte dependiendo del tamaño de la pantalla -->
    <div class="relative w-full h-dvh lg:h-[800px] lg:max-w-sm bg-[#0f111a] overflow-hidden lg:rounded-[2.5rem] lg:border-4 lg:border-gray-800 lg:shadow-2xl">

        <div id="listView" class="absolute inset-0 flex flex-col transition-transform duration-300 transform translate-x-0">
            
            <!-- Titulo Hall Of Fame -->
            <header class="pt-10 pb-6 px-6 text-center">
                <h1 class="text-3xl font-extrabold tracking-tight text-white">Speedrun <span class="text-indigo-500">HoF</span></h1>
            </header>

            <!-- Botones filtros -->
         
            <div class="px-6 pb-2 w-full"> 
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 ml-1">Categorías</h2>
                
                <div class="flex gap-3 overflow-x-auto hide-scroll pb-2 snap-x relative z-10">
                    <button id="boton_any"
                        class="shrink-0 snap-start bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-1.5 px-4 rounded-full transition shadow-lg shadow-indigo-500/50">Any%</button>
                    <button id="boton_glitchless"
                        class="shrink-0 snap-start bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-semibold py-1.5 px-4 rounded-full transition border border-gray-700">Glitchless</button>
                    <button id="boton_100"
                        class="shrink-0 snap-start bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-semibold py-1.5 px-4 rounded-full transition border border-gray-700">100%</button>
                    <button id="boton_low"
                        class="shrink-0 snap-start bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-semibold py-1.5 px-4 rounded-full transition border border-gray-700">Low%</button>
                    <button id="boton_nmg"
                        class="shrink-0 snap-start bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-semibold py-1.5 px-4 rounded-full transition border border-gray-700">NMG</button>
                    <button id="boton_tas"
                        class="shrink-0 snap-start bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-semibold py-1.5 px-4 rounded-full transition border border-gray-700">TAS</button>
                </div>

                <div class="h-[2px] mx-auto bg-gradient-to-r from-transparent via-indigo-500/40 to-transparent relative z-20 mt mb-4 rounded-full"></div>
            </div>

            <!-- Main donde salen los juegos -->
            <main id="contenedor_juegos" class="flex-1 overflow-y-auto hide-scroll px-6 pb-24 sm:pb-8 space-y-4">
                
                <!-- Plantilla para cada article, se elimina del DOM una vez se cargan todos los videos -->
                <article id="plantilla" class="group flex bg-gray-800 rounded-2xl overflow-hidden cursor-pointer border border-gray-700 hover:border-indigo-500/80 transition-all duration-300 shadow-lg relative min-h-[110px]">
                        
                        <div class="absolute inset-y-0 left-0 w-2/3">
                            <img src="" alt="" class="js-miniatura w-full h-full object-cover opacity-75 group-hover:opacity-100 transition-opacity duration-300 [-webkit-mask-image:linear-gradient(to_right,black_20%,transparent_100%)]">
                        </div>

                        <div class="relative z-10 w-full p-4 pl-28 flex flex-col justify-center">
                            <h2 class="font-bold text-white text-md leading-tight mb-1 drop-shadow-md">
                                <span class="js-titulo">Título del juego</span> 
                                <span class="js-categoria text-indigo-400 font-normal">Any%</span>
                            </h2>
                            <div class="text-xs text-gray-300 space-y-0.5 mt-2">
                                <p>Runner: <span class="js-runner text-white font-medium">Nombre</span></p>
                                <p class="js-tiempo text-emerald-400 font-mono font-semibold">Time: 00:00</p>
                            </div>
                        </div>
                                                
                        <div class="absolute bottom-3 right-4 flex items-center gap-1.5">
                            <span class="js-ultimo hidden bg-indigo-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center uppercase tracking-wider shadow-sm shadow-indigo-500/30 ring-1 ring-indigo-400">
                                Last Seen
                            </span>
                            <span class="js-visto hidden bg-emerald-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1 uppercase tracking-wider shadow-sm shadow-emerald-500/30 ring-1 ring-emerald-400">
                                Seen
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-2.5 h-2.5">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </span>
                        </div>
                                                
                    </article>           
                
            </main>
        </div>


    </div>

    <script src="data/data.js"></script>
    <script src="script.js"></script>
</body>

</html>
