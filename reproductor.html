<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detall del Speedrun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen font-sans text-gray-100">

    <div class="relative w-full max-w-sm h-[800px] max-h-screen bg-[#0f111a] border border-gray-800 shadow-2xl overflow-hidden sm:rounded-[2.5rem] sm:border-4 sm:border-gray-800 flex flex-col">
        <header class="pt-12 pb-4 px-6 text-center flex items-center justify-between relative">
            <a href="index.html" class="text-gray-400 hover:text-white transition bg-gray-800 hover:bg-gray-700 p-2 rounded-full absolute left-6">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h1 class="text-xl font-extrabold tracking-tight text-white w-full text-center">Hall of Fame</h1>
        </header>

        <main class="flex-1 overflow-y-auto hide-scroll">
            <div class="w-full aspect-video bg-black relative group">
                <video id="detalle-video" class="w-full h-full object-cover" controls></video>
            </div>

            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 id="detalle-titulo" class="text-2xl font-bold text-white mb-1"></h2>
                        <span id="detalle-categoria" class="inline-block bg-indigo-600/20 text-indigo-400 text-xs px-2 py-1 rounded-md border border-indigo-500/20"></span>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-400">Runner</p>
                        <p id="detalle-runner" class="font-bold text-white"></p>
                    </div>
                </div>

                <div class="mb-6 pb-6 border-b border-gray-800">
                    <p id="detalle-tiempo" class="text-2xl text-emerald-400 font-mono font-bold tracking-tight"></p>
                </div>

                <div>
                    <h3 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                        Detalles
                        <div class="h-px flex-1 bg-gray-800 ml-2"></div>
                    </h3>
                    <p id="detalle-descripcion" class="text-sm text-gray-300 leading-relaxed">
                    </p>
                </div>
            </div>
        </main>
    </div>

    <script src="data/data.js"></script>
    <script src="script_detalle.js"></script>

</body>
</html>
