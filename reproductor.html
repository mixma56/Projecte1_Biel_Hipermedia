<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Detall del Speedrun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        /* Oculta la barra de desplazamiento en Chrome, Safari, ... (webkits) */
        ::-webkit-scrollbar { display: none; }
       

    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-[100dvh] font-sans text-gray-100">
    <!-- Contenedor principal -->
    <div class="relative w-full h-dvh lg:h-[800px] lg:max-w-sm bg-[#0f111a] overflow-hidden lg:rounded-[2.5rem] lg:border-4 lg:border-gray-800 lg:shadow-2xl flex flex-col">
        
        <!--Header, flecha para volver al index y titulo -->
        <header class="pt-12 pb-4 px-6 text-center flex items-center justify-between relative">
            <a href="index.html" class="text-gray-400 hover:text-white transition bg-gray-800 hover:bg-gray-700 p-2 rounded-full absolute left-6">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h1 class="text-xl font-extrabold tracking-tight text-white w-full text-center">Hall of Fame</h1>
        </header>
        <!--Main donde se puede ver el video -->
        <main class="flex-1 overflow-y-auto hide-scroll pb-10">
            
            <!-- Conteedor del Video -->
            <div class="w-full aspect-video bg-black relative group cursor-pointer" id="video-container">
                <video id="detalle-video" class="w-full h-full object-cover"></video>
            </div>
            <!--Controles personalizados del video-->
            <div class="px-6 py-4 flex flex-col gap-3">

                <!--Barra de progreso-->
                <input type="range" id="progress-bar" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-white hover:h-2 transition-all" value="0" min="0" step="0.1">
                <!-- Contenedor otros controles -->
                <div class="flex items-center justify-between mt-1">
                    <!--play button y tiempo -->
                    <div class="flex items-center gap-4">
                        <button id="play-btn" class="text-white hover:text-indigo-400 transition transform hover:scale-110 focus:outline-none">
                            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                                <path id="play-icon" d="M8 5v14l11-7z"/>
                                <path id="pause-icon" class="hidden" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            </svg>
                        </button>
                        
                        <div class="text-white text-sm font-mono tracking-wider font-medium drop-shadow-md">
                            <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
                        </div>
                    </div>
                    <!--Control de volumen (tanto el icono para mutear como el slider) -->
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 w-[80px]">
                            <button id="mute-btn" class="text-gray-300 hover:text-white transition focus:outline-none">
                                <svg id="volume-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                </svg>
                            </button>
                            <input type="range" id="volume-slider" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-white" min="0" max="1" step="0.05" value="1">
                        </div>
                        <!--boton de pantalla completa (POR ARREGLAR)--> 

                    </div>

                </div>
            </div>
            <!-- Detalles del speedrun (runner, titulo, tiempo tardado, descripcion) -->
            <div class="px-6 pb-6">
                <div class="flex justify-between items-start mb-4">
                    <!--titulo del speedrun-->
                    <div>
                        <h2 id="detalle-titulo" class="text-2xl font-bold text-white mb-1"></h2>
                        <span id="detalle-categoria" class="inline-block bg-indigo-600/20 text-indigo-400 text-xs px-2 py-1 rounded-md border border-indigo-500/20"></span>
                    </div>
                    <!--runner del speedrun-->
                    <div class="text-right">
                        <p class="text-sm text-gray-400">Runner</p>
                        <p id="detalle-runner" class="font-bold text-white"></p>
                    </div>
                </div>
                <!-- tiempo del speedrun -->
                <div class="mb-6 pb-6 border-b border-gray-800">
                    <p id="detalle-tiempo" class="text-2xl text-emerald-400 font-mono font-bold tracking-tight"></p>
                </div>
                <!-- descripcion del speedrun -->
                <div>
                    <h3 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                        Details
                        <div class="h-px flex-1 bg-gray-800 ml-2"></div>
                    </h3>
                    <p id="detalle-descripcion" class="text-sm text-gray-300 leading-relaxed"></p>
                </div>
            </div>
        </main>
    </div>
    <!--json-->
    <script src="data/data.js"></script>
    <!--js del reproductor-->
    <script src="script_detalle.js"></script>

</body>
</html>
